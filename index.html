<!doctype html>
<html lang="es">

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta

      content="Jesús González Gómez — Desarrollador Full-Stack. Proyectos, formación, stack técnico y contacto."
    />
    <title>Jesús González Gómez — Full-Stack Developer</title>
    <script>
      try {
        const storedTheme = localStorage.getItem("portfolio-theme");
        const prefersLightTheme = window.matchMedia("(prefers-color-scheme: light)").matches;
        const initialTheme = storedTheme === "light" || storedTheme === "dark" ? storedTheme : prefersLightTheme ? "light" : "dark";
        if (initialTheme === "light") document.documentElement.classList.add("light");
        document.documentElement.style.colorScheme = initialTheme;
      } catch (error) {
        document.documentElement.style.colorScheme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
